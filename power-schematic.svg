<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="46" font-size="22" font-weight="bold" fill="#222">Allotment Planter Node — Power Section (v2 PCB)</text>
  <text x="40" y="72" font-size="13" fill="#666">Protected cell → XIAO onboard charge/power-path → single high-side P-FET switched peripheral rail. Signal wiring omitted — power only.</text>

  <!-- ======= Protected cell (dashed group) ======= -->
  <rect x="40" y="140" width="240" height="270" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="52" y="160" font-size="12" font-weight="bold" fill="#555">PROTECTED CELL (BOM requirement)</text>

  <!-- battery symbol -->
  <line x1="110" y1="175" x2="110" y2="197" stroke="#222" stroke-width="2"/>
  <line x1="82"  y1="197" x2="138" y2="197" stroke="#222" stroke-width="2"/>
  <line x1="94"  y1="209" x2="126" y2="209" stroke="#222" stroke-width="4"/>
  <line x1="110" y1="209" x2="110" y2="245" stroke="#222" stroke-width="2"/>
  <text x="122" y="182" font-size="14" font-weight="bold" fill="#c0392b">+</text>
  <text x="150" y="196" font-size="12" fill="#222">1S LiPo, 3.7 V</text>
  <text x="150" y="212" font-size="12" fill="#222">≥ 500 mAh</text>

  <!-- PCM block -->
  <rect x="66" y="245" width="188" height="70" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
  <text x="160" y="272" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">PCM — DW01A + FS8205</text>
  <text x="160" y="290" font-size="11" fill="#555" text-anchor="middle">UV cutoff ~2.5 V · OV · short-circuit</text>
  <text x="160" y="304" font-size="11" fill="#555" text-anchor="middle">(folded under the cell&#8217;s tape)</text>

  <!-- leads out of dashed box -->
  <line x1="254" y1="262" x2="330" y2="262" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="254" y1="300" x2="300" y2="300" stroke="#222" stroke-width="2.5"/>
  <line x1="300" y1="300" x2="300" y2="352" stroke="#222" stroke-width="2.5"/>
  <line x1="300" y1="352" x2="330" y2="352" stroke="#222" stroke-width="2.5"/>
  <text x="286" y="252" font-size="12" font-weight="bold" fill="#c0392b">B+</text>
  <text x="284" y="345" font-size="12" font-weight="bold" fill="#222">B&#8722;</text>

  <!-- ======= JST connector ======= -->
  <rect x="330" y="235" width="76" height="140" fill="#fdf6ec" stroke="#333" stroke-width="1.5"/>
  <text x="368" y="228" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">J1</text>
  <text x="368" y="262" font-size="11" fill="#222" text-anchor="middle">JST-PH</text>
  <text x="368" y="276" font-size="11" fill="#222" text-anchor="middle">2.0</text>
  <circle cx="342" cy="262" r="3.5" fill="#c0392b"/>
  <circle cx="342" cy="352" r="3.5" fill="#222"/>
  <text x="368" y="356" font-size="10" fill="#888" text-anchor="middle">polarity!</text>

  <!-- JST to XIAO wires -->
  <line x1="406" y1="262" x2="470" y2="262" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="406" y1="352" x2="470" y2="352" stroke="#222" stroke-width="2.5"/>
  <!-- GND symbol on B- -->
  <line x1="438" y1="352" x2="438" y2="372" stroke="#222" stroke-width="2"/>
  <line x1="424" y1="372" x2="452" y2="372" stroke="#222" stroke-width="2"/>
  <line x1="429" y1="378" x2="447" y2="378" stroke="#222" stroke-width="2"/>
  <line x1="434" y1="384" x2="442" y2="384" stroke="#222" stroke-width="2"/>

  <!-- ======= XIAO ESP32-S3 ======= -->
  <rect x="470" y="150" width="240" height="430" fill="#eef4fb" stroke="#2c3e50" stroke-width="2"/>
  <text x="590" y="252" font-size="15" font-weight="bold" fill="#2c3e50" text-anchor="middle">Seeed XIAO</text>
  <text x="590" y="272" font-size="15" font-weight="bold" fill="#2c3e50" text-anchor="middle">ESP32-S3</text>
  <text x="590" y="300" font-size="11" fill="#555" text-anchor="middle">onboard charge IC (~100 mA)</text>
  <text x="590" y="315" font-size="11" fill="#555" text-anchor="middle">+ power-path mux</text>
  <text x="590" y="338" font-size="11" font-style="italic" fill="#a04040" text-anchor="middle">no load disconnect —</text>
  <text x="590" y="353" font-size="11" font-style="italic" fill="#a04040" text-anchor="middle">protection lives in the cell</text>

  <!-- USB-C on top -->
  <rect x="540" y="118" width="100" height="32" fill="#dfe9f5" stroke="#2c3e50" stroke-width="1.5" rx="8"/>
  <text x="590" y="139" font-size="12" font-weight="bold" fill="#2c3e50" text-anchor="middle">USB-C</text>
  <text x="590" y="106" font-size="11" fill="#555" text-anchor="middle">exposed at enclosure edge — charge + flash (no pigtail)</text>

  <!-- XIAO pads -->
  <circle cx="470" cy="262" r="4" fill="#c0392b"/>
  <text x="480" y="258" font-size="11" font-weight="bold" fill="#222">B+ pad</text>
  <circle cx="470" cy="352" r="4" fill="#222"/>
  <text x="480" y="366" font-size="11" font-weight="bold" fill="#222">B&#8722; pad</text>
  <text x="480" y="380" font-size="9.5" fill="#888">(underside)</text>

  <circle cx="710" cy="200" r="4" fill="#e67e22"/>
  <text x="700" y="190" font-size="11" font-weight="bold" fill="#e67e22" text-anchor="end">3V3</text>
  <circle cx="710" cy="330" r="4" fill="#2980b9"/>
  <text x="700" y="326" font-size="11" font-weight="bold" fill="#2980b9" text-anchor="end">D5 / GPIO6</text>
  <text x="700" y="340" font-size="10" fill="#2980b9" text-anchor="end">PERIPH_EN</text>
  <circle cx="710" cy="430" r="4" fill="#8e44ad"/>
  <text x="700" y="426" font-size="11" font-weight="bold" fill="#8e44ad" text-anchor="end">D9 / GPIO8</text>
  <text x="700" y="440" font-size="10" fill="#8e44ad" text-anchor="end">VBAT sense</text>
  <circle cx="710" cy="540" r="4" fill="#222"/>
  <text x="700" y="536" font-size="11" font-weight="bold" fill="#222" text-anchor="end">GND</text>

  <!-- GND stub off XIAO -->
  <line x1="710" y1="540" x2="760" y2="540" stroke="#222" stroke-width="2"/>
  <line x1="760" y1="540" x2="760" y2="556" stroke="#222" stroke-width="2"/>
  <line x1="746" y1="556" x2="774" y2="556" stroke="#222" stroke-width="2"/>
  <line x1="751" y1="562" x2="769" y2="562" stroke="#222" stroke-width="2"/>
  <line x1="756" y1="568" x2="764" y2="568" stroke="#222" stroke-width="2"/>

  <!-- ======= 3V3 rail and P-FET ======= -->
  <line x1="710" y1="200" x2="920" y2="200" stroke="#e67e22" stroke-width="2.5"/>
  <text x="770" y="192" font-size="11" font-weight="bold" fill="#e67e22">3V3 rail (always on)</text>

  <!-- R1 pull-up: from 3V3 rail at x=860 down to gate node y=255 -->
  <circle cx="860" cy="200" r="3" fill="#e67e22"/>
  <polyline points="860,200 860,212 853,216 867,224 853,232 867,240 853,248 860,252 860,255"
            fill="none" stroke="#333" stroke-width="2"/>
  <text x="845" y="230" font-size="11" fill="#333" text-anchor="end">R1 100k</text>

  <!-- Gate wiring: node at (860,255) -> right to gate bar; down to GPIO6 -->
  <circle cx="860" cy="255" r="3" fill="#2980b9"/>
  <line x1="860" y1="255" x2="903" y2="255" stroke="#2980b9" stroke-width="2"/>
  <line x1="860" y1="255" x2="860" y2="330" stroke="#2980b9" stroke-width="2"/>
  <line x1="860" y1="330" x2="710" y2="330" stroke="#2980b9" stroke-width="2"/>
  <text x="800" y="322" font-size="10" fill="#2980b9">drive LOW = ON</text>

  <!-- P-FET Q1: source top at 3V3 (x=920), drain bottom -->
  <circle cx="920" cy="200" r="3" fill="#e67e22"/>
  <line x1="920" y1="200" x2="920" y2="228" stroke="#e67e22" stroke-width="2.5"/>
  <!-- channel bar -->
  <line x1="920" y1="228" x2="920" y2="288" stroke="#333" stroke-width="3"/>
  <!-- gate bar -->
  <line x1="903" y1="238" x2="903" y2="278" stroke="#333" stroke-width="3"/>
  <!-- drain lead -->
  <line x1="920" y1="288" x2="920" y2="320" stroke="#27ae60" stroke-width="2.5"/>
  <text x="928" y="222" font-size="11" font-weight="bold" fill="#333">S</text>
  <text x="928" y="302" font-size="11" font-weight="bold" fill="#333">D</text>
  <text x="893" y="250" font-size="11" font-weight="bold" fill="#333" text-anchor="end">G</text>
  <text x="938" y="252" font-size="12" font-weight="bold" fill="#222">Q1</text>
  <text x="938" y="267" font-size="11" fill="#222">AO3401</text>
  <text x="938" y="281" font-size="10" fill="#888">(P-FET, SOT-23)</text>

  <!-- ======= Switched rail + loads ======= -->
  <line x1="920" y1="320" x2="1150" y2="320" stroke="#27ae60" stroke-width="2.5"/>
  <text x="985" y="312" font-size="11" font-weight="bold" fill="#27ae60">3V3_SW — peripheral rail (dead in sleep)</text>

  <!-- load 1: moisture sensor -->
  <line x1="1065" y1="320" x2="1065" y2="350" stroke="#27ae60" stroke-width="2"/>
  <rect x="980" y="350" width="170" height="52" fill="#f2faf4" stroke="#27ae60" stroke-width="1.5"/>
  <text x="1065" y="371" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">Moisture sensor VCC</text>
  <text x="1065" y="388" font-size="10.5" fill="#555" text-anchor="middle">~5 mA, on ~100 ms per wake</text>

  <!-- load 2: e-paper -->
  <line x1="945" y1="320" x2="945" y2="460" stroke="#27ae60" stroke-width="2"/>
  <line x1="945" y1="460" x2="980" y2="460" stroke="#27ae60" stroke-width="2"/>
  <rect x="980" y="434" width="170" height="52" fill="#f2faf4" stroke="#27ae60" stroke-width="1.5"/>
  <text x="1065" y="455" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">E-paper panel VCC</text>
  <text x="1065" y="472" font-size="10.5" fill="#555" text-anchor="middle">on during refresh only</text>

  <!-- ======= Battery divider ======= -->
  <!-- B+ net flag -->
  <text x="790" y="368" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">B+</text>
  <line x1="790" y1="372" x2="790" y2="385" stroke="#c0392b" stroke-width="2"/>
  <!-- R2 -->
  <polyline points="790,385 790,392 783,396 797,404 783,412 797,420 783,428 790,432 790,438"
            fill="none" stroke="#333" stroke-width="2"/>
  <text x="805" y="410" font-size="11" fill="#333">R2 220k</text>
  <!-- tap node -->
  <circle cx="790" cy="445" r="3" fill="#8e44ad"/>
  <line x1="790" y1="438" x2="790" y2="452" stroke="#333" stroke-width="2"/>
  <!-- tap to GPIO8 -->
  <line x1="790" y1="445" x2="740" y2="445" stroke="#8e44ad" stroke-width="2"/>
  <line x1="740" y1="445" x2="740" y2="430" stroke="#8e44ad" stroke-width="2"/>
  <line x1="740" y1="430" x2="710" y2="430" stroke="#8e44ad" stroke-width="2"/>
  <!-- R3 -->
  <polyline points="790,452 790,458 783,462 797,470 783,478 797,486 783,494 790,498 790,505"
            fill="none" stroke="#333" stroke-width="2"/>
  <text x="805" y="478" font-size="11" fill="#333">R3 220k</text>
  <!-- GND under R3 -->
  <line x1="790" y1="505" x2="790" y2="518" stroke="#222" stroke-width="2"/>
  <line x1="776" y1="518" x2="804" y2="518" stroke="#222" stroke-width="2"/>
  <line x1="781" y1="524" x2="799" y2="524" stroke="#222" stroke-width="2"/>
  <line x1="786" y1="530" x2="794" y2="530" stroke="#222" stroke-width="2"/>
  <!-- C1 off the tap -->
  <line x1="790" y1="445" x2="868" y2="445" stroke="#8e44ad" stroke-width="2"/>
  <line x1="868" y1="445" x2="868" y2="462" stroke="#333" stroke-width="2"/>
  <line x1="853" y1="462" x2="883" y2="462" stroke="#333" stroke-width="2.5"/>
  <line x1="853" y1="471" x2="883" y2="471" stroke="#333" stroke-width="2.5"/>
  <line x1="868" y1="471" x2="868" y2="488" stroke="#222" stroke-width="2"/>
  <line x1="854" y1="488" x2="882" y2="488" stroke="#222" stroke-width="2"/>
  <line x1="859" y1="494" x2="877" y2="494" stroke="#222" stroke-width="2"/>
  <line x1="864" y1="500" x2="872" y2="500" stroke="#222" stroke-width="2"/>
  <text x="890" y="470" font-size="11" fill="#333">C1 100 nF</text>
  <text x="890" y="484" font-size="10" fill="#a04040" font-style="italic">required, not optional</text>
  <text x="790" y="552" font-size="10" fill="#888" text-anchor="middle">9.5 &#181;A continuous</text>

  <!-- ======= Notes box ======= -->
  <rect x="40" y="612" width="700" height="160" fill="#fbf9f2" stroke="#bbb" stroke-width="1"/>
  <text x="54" y="634" font-size="12" font-weight="bold" fill="#333">PCB / firmware notes</text>
  <text x="54" y="656" font-size="11.5" fill="#333">&#8226; Q1 logic is inverted vs GPIO-powered sensor: gate LOW = rail ON.  R1 guarantees OFF while the pin floats (boot, deep sleep).</text>
  <text x="54" y="678" font-size="11.5" fill="#333">&#8226; Before sleep: drive ALL sensor/panel signal lines LOW + gpio_hold_en() &#8212; a HIGH line back-powers the dead 3V3_SW rail</text>
  <text x="66" y="694" font-size="11.5" fill="#333">through the peripherals&#8217; ESD diodes.</text>
  <text x="54" y="716" font-size="11.5" fill="#333">&#8226; No external charge/boost board (J5019 etc.): the XIAO&#8217;s onboard charger + power path covers it, and a boost converter&#8217;s</text>
  <text x="66" y="732" font-size="11.5" fill="#333">quiescent draw alone would dwarf the ~35 &#181;A sleep budget.</text>
  <text x="54" y="754" font-size="11.5" fill="#333">&#8226; Radio policy: WiFi on alert / daily heartbeat only (planter model).  Port the fridge repo&#8217;s brownout-conservation logic.</text>

  <!-- mini legend -->
  <rect x="770" y="612" width="380" height="160" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
  <text x="784" y="634" font-size="12" font-weight="bold" fill="#333">Nets</text>
  <line x1="784" y1="650" x2="824" y2="650" stroke="#c0392b" stroke-width="2.5"/>
  <text x="832" y="654" font-size="11" fill="#333">B+ (raw cell, via PCM)</text>
  <line x1="784" y1="672" x2="824" y2="672" stroke="#e67e22" stroke-width="2.5"/>
  <text x="832" y="676" font-size="11" fill="#333">3V3 — XIAO LDO output, always on</text>
  <line x1="784" y1="694" x2="824" y2="694" stroke="#27ae60" stroke-width="2.5"/>
  <text x="832" y="698" font-size="11" fill="#333">3V3_SW — switched peripheral rail</text>
  <line x1="784" y1="716" x2="824" y2="716" stroke="#2980b9" stroke-width="2.5"/>
  <text x="832" y="720" font-size="11" fill="#333">PERIPH_EN (GPIO6)</text>
  <line x1="784" y1="738" x2="824" y2="738" stroke="#8e44ad" stroke-width="2.5"/>
  <text x="832" y="742" font-size="11" fill="#333">VBAT sense (GPIO8)</text>
</svg>
