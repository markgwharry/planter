<text x="845" y="472" font-size="14" font-weight="400">GND</text>
<text x="565" y="525" font-size="16" font-weight="400">C2/C3 at J3. R1 holds Q1 off during reset.</text>
<text x="565" y="548" font-size="16" font-weight="400">Park EPD outputs LOW before removing power.</text>
<rect x="1075" y="100" width="495" height="465" rx="10" fill="white" stroke="#bacbc4"/>
