<text x="30" y="1040" font-size="17" font-weight="700">ASSEMBLY: underside BAT contacts and connector footprints need mechanical confirmation. USB charging cover deferred.</text>
<text x="30" y="1075" font-size="17" font-weight="400">REVIEW STATUS: corrected circuit specification. Native KiCad capture/ERC, board layout/DRC and bench validation remain outstanding.</text>
<text x="30" y="1110" font-size="16" font-weight="400">Sources: Seeed XIAO C6 schematic 2026-01-14 (03 Power); AOS AO3401A datasheet; supplied WeAct 1.54-inch board drawing.</text>
<text x="30" y="1138" font-size="16" font-weight="400">Supporting files: netlist.csv, bom.csv, README.md, review.md. This SVG is not a fabrication release.</text>
