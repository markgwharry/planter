<text x="213" y="336" font-size="14" font-weight="700">R3 200k 1%</text>
<text x="287" y="343" font-size="14" font-weight="400">GND</text>
<text x="202" y="374" font-size="12" font-weight="400">1</text>
<text x="276" y="374" font-size="12" font-weight="400">2</text>
<text x="65" y="407" font-size="14" font-weight="400">VBAT_ADC</text>
<path class="wire" d="M65,416 L232,416"/>
<path class="wire" d="M232,405 L232,427"/>
<path class="wire" d="M245,405 L245,427"/>
<path class="wire" d="M245,416 L425,416"/>
<text x="214" y="398" font-size="14" font-weight="700">C1 100nF</text>
<text x="330" y="407" font-size="14" font-weight="400">GND</text>
<text x="50" y="463" font-size="16" font-weight="700">A0 = PACK+ / 2; at 4.2V pack, A0 = 2.1V.</text>
<text x="50" y="493" font-size="16" font-weight="400">R3 is mandatory. XIAO R10 belongs to its charger.</text>
<text x="50" y="523" font-size="16" font-weight="400">All battery loads, including R2, are after JP1.</text>
<text x="50" y="546" font-size="15" font-weight="400">External common-port protection; no raw B- to GND.</text>
<rect x="545" y="100" width="510" height="465" rx="10" fill="white" stroke="#bacbc4"/>
<text x="565" y="132" font-size="20" font-weight="700">2  Shared peripheral power / active LOW</text>
<text x="565" y="165" font-size="18" font-weight="700">Q1 AO3401A / SOT-23</text>
<text x="565" y="197" font-size="17" font-weight="400">Pad 2 (S) = 3V3; pad 3 (D) = 3V3_SW</text>
<text x="565" y="228" font-size="17" font-weight="400">Pad 1 (G) = GATE; body diode D -&gt; S</text>
<text x="580" y="282" font-size="14" font-weight="400">3V3</text>
