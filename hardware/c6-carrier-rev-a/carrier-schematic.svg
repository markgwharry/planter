<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160">
<style>text{font-family:Arial,sans-serif;fill:#172b3a} .wire{stroke:#216351;stroke-width:2;fill:none}</style>
<rect width="1600" height="1160" fill="#f4f7f6"/>
<text x="30" y="42" font-size="29" font-weight="700">PLANTER / XIAO ESP32-C6 / REV A</text>
<text x="30" y="72" font-size="17" font-weight="400">Electrical review: 2026-09-05. Matching net names connect across sections. All resistors/capacitors shown are FITTED.</text>
<rect x="30" y="100" width="495" height="465" rx="10" fill="white" stroke="#bacbc4"/>
<text x="50" y="132" font-size="20" font-weight="700">1  Protected battery and complete divider</text>
<text x="50" y="165" font-size="16" font-weight="400">J1.1 P+ -- JP1.1 [removable link] JP1.2 -- PACK+</text>
<text x="50" y="196" font-size="16" font-weight="400">J1.2 P- -------------------------------- GND</text>
<text x="50" y="228" font-size="15" font-weight="400">PACK+ -&gt; XIAO BAT+; GND -&gt; XIAO BAT- and GND</text>
<text x="65" y="282" font-size="14" font-weight="400">PACK+</text>
<path class="wire" d="M65,291 L215,291"/>
<rect x="215" y="283" width="56" height="16" fill="white" stroke="#216351" stroke-width="2"/>
<path class="wire" d="M271,291 L425,291"/>
<text x="213" y="275" font-size="14" font-weight="700">R2 200k 1%</text>
<text x="287" y="282" font-size="14" font-weight="400">VBAT_ADC</text>
<text x="202" y="313" font-size="12" font-weight="400">1</text>
<text x="276" y="313" font-size="12" font-weight="400">2</text>
<text x="65" y="343" font-size="14" font-weight="400">VBAT_ADC</text>
