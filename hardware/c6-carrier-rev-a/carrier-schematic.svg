<text x="50" y="910" font-size="16" font-weight="400">C4 at U1; C5 at J2. Probe power is 3.3V.</text>
<text x="50" y="942" font-size="16" font-weight="400">J2 connector/cable pin order must be confirmed.</text>
<text x="50" y="973" font-size="16" font-weight="400">Cable ESD component selection remains open.</text>
<rect x="545" y="585" width="510" height="415" rx="10" fill="white" stroke="#bacbc4"/>
