; Rev B PCB carrier (hardware/carrier-rev-b): one board, socketed C6 or S3.
;   pio run -c platformio-rev-b.ini -e esp32c6_rev_b -t upload
;   pio run -c platformio-rev-b.ini -e esp32s3_rev_b -t upload
[platformio]
src_dir = firmware-v2
include_dir = src

[common]
monitor_speed = 115200
lib_deps =
    zinggjm/GxEPD2@^1.6.5
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit BusIO@^1.16.2
    knolleary/PubSubClient@^2.8

[env:esp32c6_rev_b]
; Same pioarduino platform as platformio-c6.ini (Arduino-ESP32 3.x for C6).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
build_flags =
    -DPLANTER_CARRIER_REV_B=1
    -DPLANTER_XIAO_C6=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}

[env:esp32s3_rev_b]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
build_flags =
    -DPLANTER_CARRIER_REV_B=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = ${common.monitor_speed}
monitor_dtr = 1
monitor_rts = 0
lib_deps = ${common.lib_deps}
