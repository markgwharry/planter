; Yarplot allotment hub — headless ESP32-C3 soil-moisture node.
; Standalone project: open this folder in PlatformIO on its own; it does
; not share the root planter build.

[env:esp32c3]
platform  = espressif32
board     = esp32-c3-devkitm-1   ; generic ESP32-C3, fits the C3 SuperMini
framework = arduino

; Native USB-CDC serial (the SuperMini exposes USB-C straight off the C3).
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200

; Set these to your port when flashing (leave commented for auto-detect):
; upload_port = /dev/cu.usbmodem101
; monitor_port = /dev/cu.usbmodem101

; mbedtls / WiFi / HTTPClient / WiFiClientSecure ship with the core.
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
